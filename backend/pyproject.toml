[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianji-yanxiang-backend"
version = "0.2.0"
requires-python = ">=3.11"
description = "天机演象术数推演后端：历法、周易、梅花易数、六爻、大六壬、奇门、八字、紫微、风水引擎与七步推理工作流"
# 依赖唯一真源仍放在 requirements.txt，避免两处版本号漂移
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==7.4.4", "httpx<0.28"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "scripts/__pycache__"]

[tool.ruff.lint]
# 先只开「能真报错」的规则集：语法/未定义名/未使用导入。
# 排版类（E501）与 import 排序（I）暂不强制，避免一次性改写全部历史文件。
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# 这两个模块是刻意的「名称转出」层（app.common → 兼容路径），
# 导入本身就是被 re-export 的 API，不能按未使用删掉。
"app/core/constants.py" = ["F401"]
"app/bazi/rules.py" = ["F401"]
