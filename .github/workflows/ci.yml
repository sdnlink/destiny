name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        # CI 上没有 ClickHouse，依赖数据库的用例会条件跳过并打印原因，不会伪装成通过。
        # 20MB 典籍全文语料 data/generated/ 不入库；测试在完整语料缺失时自动改用
        # data/validation-cases/classics-fixture 的压缩原文片段，检索/证据链仍真实执行，
        # 只有「完整语料规模/来源清单」断言条件跳过。
        # 玄空起星图已改为读取 data/validation-cases/ 派生样例，CI 可完整覆盖。
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Node module tests
        run: npm run test:node
